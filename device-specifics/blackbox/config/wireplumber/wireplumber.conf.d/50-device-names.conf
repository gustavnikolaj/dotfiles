# Friendly names for the USB audio devices on the monitor's KVM hub.
#
# These are the same physical devices tpx1 sees through the same hub, so the
# speaker and DAC names match device-specifics/tpx1/ deliberately - switching
# the KVM should not rename anything.
#
# Two entries per device: the node.* entry renames the sink/source you pick in a
# volume UI, the device.* entry renames the card. device.name uses a "~" prefix,
# which makes it a regex - hence the escaped dots.
#
# Names come from USB product strings, not bus paths, so they survive replugging
# and KVM switching. The mic is the exception: its name embeds the USB serial
# (214b206000000178), so a replacement mic needs these strings updated. Re-check
# any of them with:  wpctl status  then  wpctl inspect <id>

monitor.alsa.rules = [
  # --- USB Speakers (Alesis M1Active 520USB) ---
  { matches = [ { node.name = "alsa_output.usb-Burr-Brown_from_TI_USB_Audio_CODEC-00.analog-stereo" } ]
    actions = { update-props = { node.description = "Alesis Speakers", node.nick = "Alesis Speakers" } } },
  { matches = [ { node.name = "alsa_input.usb-Burr-Brown_from_TI_USB_Audio_CODEC-00.analog-stereo" } ]
    actions = { update-props = { node.description = "Alesis Line In", node.nick = "Alesis Line In" } } },
  { matches = [ { device.name = "~alsa_card\\.usb-Burr-Brown_from_TI_USB_Audio_CODEC-00" } ]
    actions = { update-props = { device.description = "Alesis Speakers", device.nick = "Alesis Speakers" } } },

  # --- FiiO DAC (E10) ---
  { matches = [ { node.name = "alsa_output.usb-FiiO_DigiHug_USB_Audio-01.analog-stereo" } ]
    actions = { update-props = { node.description = "FiiO DAC", node.nick = "FiiO DAC" } } },
  { matches = [ { device.name = "~alsa_card\\.usb-FiiO_DigiHug_USB_Audio-01" } ]
    actions = { update-props = { device.description = "FiiO DAC", device.nick = "FiiO DAC" } } },

  # --- Condenser microphone (DCMT Technology) ---
  { matches = [ { node.name = "alsa_input.usb-DCMT_Technology_USB_Condenser_Microphone_214b206000000178-00.pro-input-0" } ]
    actions = { update-props = { node.description = "Condenser Mic", node.nick = "Condenser Mic" } } },
  { matches = [ { device.name = "~alsa_card\\.usb-DCMT_Technology_USB_Condenser_Microphone_214b206000000178-00" } ]
    actions = { update-props = { device.description = "Condenser Mic", device.nick = "Condenser Mic" } } }
]
